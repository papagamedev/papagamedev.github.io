<!-- Contact Form -->
<div class="contact-form-section">
  <h3>{{ T "contactForm" }}</h3>
  <form id="contact-form" class="comment-form">
    <!-- Honeypot field to catch spam bots - hidden from real users -->
    <div class="form-group" style="position: absolute; left: -5000px;" aria-hidden="true">
      <label for="contact-hidden">Leave this field empty
        <input type="text" id="contact-hidden" name="hidden" tabindex="-1" autocomplete="off">
      </label>
    </div>
    
    <div class="form-group">
      <label for="contact-name">{{ T "name" }} *
        <input type="text" id="contact-name" name="name" required>
      </label>
    </div>
    
    <div class="form-group">
      <label for="contact-email">{{ T "email" }} *
        <input type="email" id="contact-email" name="email" required>
      </label>
    </div>
    
    <div class="form-group">
      <label for="contact-subject">{{ T "subject" }} *
        <input type="text" id="contact-subject" name="subject" required>
      </label>
    </div>
    
    <div class="form-group">
      <label for="contact-message">{{ T "formMessage" }} *
        <textarea id="contact-message" name="message" required rows="5"></textarea>
      </label>
    </div>
    
    {{ if site.Params.reCaptcha.siteKey }}
      <div class="g-recaptcha" data-sitekey="{{ site.Params.reCaptcha.siteKey }}"></div>
    {{ end }}
    
    <button type="submit" class="btn btn-primary">{{ T "send" }}</button>
    <span class="form-message" id="contact-message-status"></span>
  </form>
</div>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
(function() {
  const form = document.getElementById('contact-form');
  const messageEl = document.getElementById('contact-message-status');
  
  if (!form) return;
  
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = '{{ T "sending" }}';
    messageEl.textContent = '';
    messageEl.className = 'form-message';
    
    try {
      const formData = new FormData(form);
      
      const response = await fetch('{{ site.Params.backend.contactApi }}', {
        method: 'POST',
        body: formData
      });
      
      if (response.ok) {
        messageEl.textContent = '{{ T "successMessage" }}';
        messageEl.className = 'form-message success';
        form.reset();
      } else {
        messageEl.textContent = '{{ T "errorMessage" }}';
        messageEl.className = 'form-message error';
      }
    } catch (err) {
      console.error('Contact form submission error:', err);
      messageEl.textContent = '{{ T "errorMessage" }}';
      messageEl.className = 'form-message error';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = originalText;
    }
  });
})();
</script>
